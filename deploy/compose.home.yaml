services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tempmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: tempmail
    tmpfs: ["/var/lib/postgresql/data:size=512m,mode=0700"]
    shm_size: 64mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tempmail"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    networks: [private]
    logging: {driver: local, options: {max-size: 5m, max-file: '2'}}
  receiver:
    build: ../server
    environment:
      DATABASE_URL: postgresql://tempmail:${POSTGRES_PASSWORD}@db:5432/tempmail
      MAIL_DOMAIN: ${MAIL_DOMAIN:-inbox.temp-mail.serwerbb.win}
      MAIL_API_KEY: ${MAIL_API_KEY:?Set MAIL_API_KEY}
      MAIL_INGRESS_READY: ${MAIL_INGRESS_READY:-false}
    # Local testing first; production SMTP mapping uses smtp.override.yaml.
    ports: ["127.0.0.1:2525:2525"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [private]
    logging: {driver: local, options: {max-size: 5m, max-file: '2'}}
  web:
    build: {context: '..', dockerfile: deploy/Dockerfile.web}
    environment:
      MAIL_API_ORIGIN: http://receiver:8080
      SITE_ORIGIN: https://temp-mail.serwerbb.win
      MAIL_API_KEY: ${MAIL_API_KEY:?Set MAIL_API_KEY}
    depends_on: [receiver]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks:
      private:
      public:
        aliases: [temp-mail-web]
    logging: {driver: local, options: {max-size: 5m, max-file: '2'}}
networks:
  private:
  public: {external: true, name: caddy_default}
